<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avaloris</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0b0f14;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      max-width: 700px;
      padding: 40px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #8b949e;
      margin-bottom: 30px;
    }

    .card {
      background: #111823;
      border: 1px solid #1f2a37;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .label {
      color: #8b949e;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    a {
      color: #58a6ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 25px;
      color: #6e7681;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Avaloris</h1>
    <div class="tagline">A quiet base for experiments, systems, and ideas.</div>

    <div class="card">
      <div class="label">Alias</div>
      <div>Apollo — Nick Name</div>
      <div>Kosmic Kodex — development Handle (GitHub)</div>
    </div>

    <div class="card">
      <div class="label">Contact</div>
      <div><a href="mailto:Apollo@avaloris.net">Apollo@avaloris.net</a></div>
    </div>

    <div class="card">
      <div class="label">Projects</div>
      <div>Coming soon — systems, tools, and experiments hosted here.</div>
    </div>

    <footer>
      Built with Cloudflare Pages • No tracking • No analytics
    </footer>
  </div>
</body>
</html>
