<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avaloris Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef4ff;

      background:
        radial-gradient(circle at 18% 0%, rgba(90,140,255,0.30), transparent 38%),
        radial-gradient(circle at 82% 18%, rgba(180,90,255,0.20), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(0,255,200,0.10), transparent 36%),
        linear-gradient(180deg, #10172a 0%, #070b14 100%);

      padding: 40px 22px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 42px;
      border-radius: 24px;

      background:
        linear-gradient(180deg,
        rgba(22,31,52,0.86),
        rgba(10,14,24,0.92));

      border: 1px solid rgba(140,170,255,0.22);

      box-shadow:
        0 0 90px rgba(88,166,255,0.12);

      backdrop-filter: blur(16px);
    }

    a {
      color: #a9ffe8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 8vw, 70px);
      letter-spacing: 7px;
      color: white;
    }

    .subtitle {
      color: #b1bdcf;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .section-title {
      color: #8b9ab2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      margin-bottom: 16px;
    }

    .panel {
      padding: 22px;
      border-radius: 18px;

      background:
        rgba(17,24,35,0.72);

      border: 1px solid rgba(255,255,255,0.07);

      margin-top: 18px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;

      background:
        rgba(14,20,32,0.9);

      color: #eef4ff;
      padding: 12px;
      font: inherit;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid rgba(127,255,212,0.24);
      border-radius: 999px;

      background:
        rgba(127,255,212,0.06);

      color: #a9ffe8;
      padding: 9px 14px;
      cursor: pointer;
      font: inherit;
      margin-right: 8px;
    }

    button.delete {
      color: #ff9aa8;
      border-color: rgba(255,120,140,0.28);

      background:
        rgba(255,120,140,0.06);

      margin-top: 12px;
    }

    .entry {
      padding: 16px;
      border-radius: 16px;

      background:
        rgba(10,14,24,0.55);

      border: 1px solid rgba(255,255,255,0.06);

      margin-top: 12px;
    }

    .entry strong {
      display: block;
      margin-bottom: 6px;
      color: #f4f7ff;
    }

    .entry p {
      margin: 0;
      color: #b9c4d6;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .time {
      margin-top: 8px;
      color: #7f8ca0;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 12px;
      color: #b1bdcf;
      font-size: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }

    .module-grid {
      display: grid;
      gap: 18px;
    }

  </style>
</head>

<body>

  <main class="container">

    <div class="top">
      <a href="/">← Back to Avaloris</a>
    </div>

    <h1>ADMIN</h1>

    <div class="subtitle">
      Control panel for managing Avaloris systems.
    </div>

    <section id="login-panel" class="panel">

      <div class="section-title">
        Authentication
      </div>

      <input
        id="admin-key"
        type="password"
        placeholder="Admin key"
      />

      <button id="login-button">
        Unlock
      </button>

      <div id="login-message" class="message"></div>

    </section>

    <section id="entries-panel" class="panel hidden">

      <div class="section-title">
        Guestbook Moderation
      </div>

      <button id="refresh-button">
        Refresh entries
      </button>

      <button id="logout-button">
        Lock
      </button>

      <div id="entries" class="message">
        Loading entries...
      </div>

    </section>

  </main>

  <script>

    const adminUrl = "https://admin.avaloris.net";

    let adminKey = "";

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);

      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    async function loadEntries() {

      const entriesBox = document.getElementById("entries");

      entriesBox.textContent = "Loading entries...";

      const response = await fetch(`${adminUrl}/entries`, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({ adminKey })
      });

      const entries = await response.json();

      if (entries.error) {
        entriesBox.textContent = entries.error;
        return;
      }

      if (!entries.length) {
        entriesBox.textContent = "No guestbook entries.";
        return;
      }

      entriesBox.innerHTML = entries.map(entry => `
        <div class="entry">

          <strong>${escapeHTML(entry.name)}</strong>

          <p>${escapeHTML(entry.message)}</p>

          <div class="time">
            ${formatTime(entry.createdAt)}
          </div>

          <button
            class="delete"
            onclick="deleteEntry('${entry.id}')">

            Delete

          </button>

        </div>
      `).join("");
    }

    async function deleteEntry(id) {

      if (!confirm("Delete this entry?")) {
        return;
      }

      await fetch(`${adminUrl}/delete`, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          adminKey,
          id
        })
      });

      loadEntries();
    }

    document
      .getElementById("login-button")
      .addEventListener("click", async () => {

        adminKey =
          document.getElementById("admin-key").value;

        const response = await fetch(`${adminUrl}/login`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({ adminKey })
        });

        const result = await response.json();

        if (result.error) {

          document.getElementById("login-message")
            .textContent = result.error;

          return;
        }

        document
          .getElementById("login-panel")
          .classList.add("hidden");

        document
          .getElementById("entries-panel")
          .classList.remove("hidden");

        loadEntries();
      });

    document
      .getElementById("refresh-button")
      .addEventListener("click", loadEntries);

    document
      .getElementById("logout-button")
      .addEventListener("click", () => {

        adminKey = "";

        document.getElementById("admin-key").value = "";

        document.getElementById("entries").textContent = "";

        document
          .getElementById("entries-panel")
          .classList.add("hidden");

        document
          .getElementById("login-panel")
          .classList.remove("hidden");
      });

  </script>

</body>
</html>
